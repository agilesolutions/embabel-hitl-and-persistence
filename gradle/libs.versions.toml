[versions]
springBoot = "4.0.0"
springFramework = "7.0.0"
jakartaEe = "11.0.0"
hibernate = "7.0.0.Beta1"
postgresql = "42.7.2"
springRetry = "2.0.12"
embabel-agent = "0.3.5"
embabel-common = "2.0.1"
testcontainers = "1.20.1"

[plugins]
springBoot = { id = "org.springframework.boot", version.ref = "springBoot" }
springDependencyManagement = { id = "io.spring.dependency-management", version = "1.1.4" }
java = { id = "org.java" }

[libraries]
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-retry = { module = "org.springframework.retry:spring-retry", version.ref = "springRetry" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }

flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
hibernate-envers = { module = "org.hibernate.orm:hibernate-envers", version.ref = "hibernate" }
spring-data-envers = { module = "org.springframework.data:spring-data-envers" }

embabel-agent = { module = "com.embabel.agent:embabel-agent-ai", version.ref = "embabel-agent" }
embabel-agent-shell = { module = "com.embabel.agent:embabel-agent-starter", version.ref = "embabel-agent" }
embabel-common = { module = "com.embabel.common:embabel-common-core", version.ref = "embabel-common" }

lombok = { module = "org.projectlombok:lombok", version = "1.18.44" }

# Testing
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-grafana = { module = "org.testcontainers:grafana", version.ref = "testcontainers" }
